name: Appeals security and policy
on:
  push:
    branches:
      - feature/question-appeals-v2-20261109
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-and-prompt-injection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Run appeals and adversarial tests
        working-directory: backend
        run: python -m unittest -v tests.test_appeal_policy tests.test_appeal_ai_security
      - name: Compile new appeals modules
        run: python -m compileall -q backend/persistence/appeal_policy.py backend/persistence/appeal_service.py backend/persistence/appeal_ai_security.py
      - name: Check Alembic heads
        working-directory: backend
        run: python -m alembic heads
