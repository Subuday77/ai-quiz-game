name: Platinum Helper validation
on:
  push:
    branches:
      - feature/platinum-helper-star-perks-integration
      - feature/platinum-helper-54-guardrails
      - feature/platinum-helper-skill-calibration-20261108
  pull_request:
    branches:
      - feature/star-perks-shop
      - feature/platinum-helper-star-perks-integration
      - feature/platinum-helper-54-guardrails
      - fix/late-question-recovery-20261108
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platinum-helper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: python -m pip install -r backend/requirements.txt
      - name: Backend unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Frontend unit tests
        working-directory: frontend
        run: timeout 120s npm test
      - name: Angular production build
        if: always()
        working-directory: frontend
        run: npm run build

  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quiz
          POSTGRES_PASSWORD: quiz_test
          POSTGRES_DB: quiz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quiz -d quiz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://quiz:quiz_test@127.0.0.1:5432/quiz_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify Alembic revision chain
        working-directory: backend
        run: python -m alembic heads
      - name: Upgrade temporary PostgreSQL to latest schema
        working-directory: backend
        run: |
          python -m alembic upgrade 0006_platinum_helper
          python -m alembic current
          python -m alembic upgrade 0007_bonus_wager
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          from sqlalchemy.orm import Session
          from persistence.database import engine
          from persistence.models import User, GameRun
          with Session(engine()) as db:
              user = User(username="Migration QA", username_key="migration-qa")
              db.add(user)
              db.flush()
              db.add_all([
                  GameRun(user_id=user.id, language="English", status="main",
                          started_at=datetime.now(timezone.utc) - timedelta(days=3)),
                  GameRun(user_id=user.id, language="Russian", status="main"),
              ])
              db.commit()
          PY
          python -m alembic upgrade head
          python -m alembic current
          python - <<'PY'
          from sqlalchemy import select
          from sqlalchemy.exc import IntegrityError
          from sqlalchemy.orm import Session
          from persistence.database import engine
          from persistence.models import User, GameRun
          with Session(engine()) as db:
              uid = db.scalar(select(User.id).where(User.username_key == "migration-qa"))
              games = list(db.scalars(select(GameRun).where(
                  GameRun.user_id == uid).order_by(GameRun.started_at)))
              assert [g.status for g in games] == ["abandoned", "main"], games
              assert games[0].finished_at is not None
              db.add(GameRun(user_id=uid, language="French", status="bonus"))
              try:
                  db.flush()
              except IntegrityError:
                  db.rollback()
              else:
                  raise AssertionError("Unique active-round index did not block duplicate")
          PY
      - name: Validate helper tables and previous star categories
        working-directory: backend
        run: |
          python -c "from sqlalchemy import inspect; from persistence.database import engine; db=inspect(engine()); tables=set(db.get_table_names()); assert {'platinum_helper_purchases','platinum_helper_calls','wallet_transactions','game_runs'}.issubset(tables), tables; assert 'bonus_wager_accepted' in {c['name'] for c in db.get_columns('game_runs')}; print('Schema ready')"
      - name: Enforce single active game at PostgreSQL level
        working-directory: backend
        run: |
          python -c "from sqlalchemy import text; from persistence.database import engine; conn=engine().connect(); definition=conn.execute(text(\"SELECT indexdef FROM pg_indexes WHERE schemaname=current_schema() AND tablename='game_runs' AND indexname='ux_game_runs_one_active_per_user'\")).scalar_one(); assert 'UNIQUE INDEX' in definition and 'status' in definition, definition; print(definition); conn.close()"
