# Preserve the TLS scheme supplied by the trusted host reverse proxy.
map $http_x_forwarded_proto $upstream_scheme {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
    }

    # The HTML entry point must be revalidated on every visit: it names the
    # current hashed JS/CSS bundles. This exact match also handles SPA fallback
    # internally redirected to /index.html by try_files.
    location = /index.html {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files /index.html =404;
    }

    # Hashed Angular bundles are content-addressed and safe to cache forever.
    # Match only root-level bundles; /api/ requests still reach the backend.
    location ~* ^/(main|polyfills|styles|chunk)-[A-Za-z0-9_-]+\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Public publisher-information pages must work without Angular, auth,
    # JavaScript, or a trailing slash. Keep the English HTML crawlable.
    location = /about {
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store, max-age=0" always;
        try_files /about.html =404;
    }
    location = /contact {
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store, max-age=0" always;
        try_files /contact.html =404;
    }
    location ~ ^/(about|contact)[.]html$ {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }
    location ~ ^/site-pages(-preload)?[.](css|js)$ {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    # Always serve the real crawler files, never the Angular HTML fallback.
    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
